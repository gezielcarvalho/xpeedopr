version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xpeedopr-backend
    ports:
      - "5108:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - AppSettings__Secret=super_A!234567a_secret
      - AppSettings__TokenLifeTime=60
      - AppSettings__Issuer=http://localhost:5108
      - AppSettings__Audience=http://localhost:5108
    networks:
      - xpeedopr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/user"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=http://localhost:5108
    container_name: xpeedopr-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - xpeedopr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backoffice:
    build:
      context: ./backoffice
      dockerfile: Dockerfile
      args:
        - API_URL=http://localhost:5108
    container_name: xpeedopr-backoffice
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - xpeedopr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  xpeedopr-network:
    driver: bridge

volumes:
  backend-data:
